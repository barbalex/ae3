<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="/safari-pinned-tab.svg"
      color="#943400"
    />
    <meta
      name="msapplication-TileColor"
      content="#943400"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#943400"
    />
    <meta
      name="background-color"
      content="#943400"
    />
    <meta
      name="description"
      content="Arteigenschaften nachschlagen, importieren, exportieren"
    />
    <meta
      name="keywords"
      content="Naturschutz, Artenschutz, Flora, Pflanzen, Pilze, Moose"
    />
    <title>arteigenschaften</title>
    <script>
      // Runs before first paint. Resolves the stored theme mode
      // ('system' | 'light' | 'dark', JSON-encoded by jotai's
      // atomWithStorage) against the OS preference and sets html[data-theme]
      // + color-scheme, so dark mode does not flash. App.jsx keeps both in
      // sync afterwards.
      ;(() => {
        let storedThemeMode
        try {
          storedThemeMode = JSON.parse(
            localStorage.getItem('ae-theme-mode') ?? 'null',
          )
        } catch {
          storedThemeMode = null
        }
        const isDark =
          storedThemeMode === 'dark' ||
          (storedThemeMode !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        const html = document.documentElement
        html.dataset.theme = isDark ? 'dark' : 'light'
        html.style.colorScheme = isDark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
