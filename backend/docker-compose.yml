services:
  db:
    # specify container name to make it easier to run commands
    container_name: ae_db
    restart: always
    image: ae-db
    # ensure enough shared memory - docker only allows 64mb
    # https://stackoverflow.com/a/56754077/712005
    shm_size: 1g
    build:
      context: ./db
    env_file:
      - ./.env
    networks:
      - network
    expose:
      - "5432"
    ports:
      # make the Postgres database accessible from outside the Docker container on port 5432
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
      # keep the rclone config (nextcloud backup target) across container recreations
      - /root/backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      # give the first-run restore of ae.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  postgrest:
    container_name: ae_postgrest
    restart: always
    image: postgrest/postgrest:v12.2.3
    networks:
      - network
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./.env
    environment:
      # connects with the same authenticator and jwt secret postgraphile used:
      # tokens issued by ae.login remain valid.
      # if the secret contains a dollar sign, .env must escape it as $$
      PGRST_DB_URI: ${DATABASE_URL}
      # v12 may otherwise try reading config from the database
      PGRST_DB_CONFIG: 'false'
      PGRST_DB_SCHEMAS: ae
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_CORS_ENABLED: true
  caddy:
    build:
      context: ./caddy
    container_name: ae_caddy
    networks:
      - network
    depends_on:
      - postgrest
    restart: always
    # original image downgrades user but that seems not to work
    # see: https://caddy.community/t/basic-docker-compose-setup-failing/6892/7?u=alexander_gabriel
    user: root
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_certs:/data
      - caddy_config:/config
volumes:
  db_data:
  sik_data:
  caddy_certs:
  caddy_config:
networks:
  network:
