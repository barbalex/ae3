# name: ae
services:
  db:
    # specify container name to make it easier to run commands
    container_name: ae_db
    restart: always
    image: ae-db-dev
    # ensure enough shared memory - docker only allows 64mb
    # https://stackoverflow.com/a/56754077/712005
    shm_size: 1g
    build:
      context: ./db
    env_file:
      - ./.env
    networks:
      - network
    expose:
      - "5432"
    ports:
      # make the Postgres database accessible from outside the Docker container on port 5432
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - sik_data:/sik_data
    platform: linux/amd64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      # give the first-run restore of ae.backup time to finish
      # before health failures are counted
      start_period: 5m
      interval: 5s
      timeout: 5s
      retries: 5
  postgrest:
    container_name: ae_postgrest
    restart: always
    image: postgrest/postgrest:v12.2.3
    networks:
      - network
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - ./.env
    environment:
      # connects with the same authenticator and jwt secret postgraphile used:
      # tokens issued by ae.login remain valid.
      # the secret contains a dollar sign, so .env escapes it as $$
      PGRST_DB_URI: ${DATABASE_URL}
      # v12 may otherwise try reading config from the database
      PGRST_DB_CONFIG: 'false'
      PGRST_DB_SCHEMAS: ae
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_CORS_ENABLED: true
volumes:
  db_data:
  sik_data:
networks:
  network:
